<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           viewport-fit=cover"
>

<meta name="theme-color" content="#0b3954">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<title>沖繩家族自駕 App</title>


<style>

/* =========================================================
   基本設定
========================================================= */

:root {

  --navy: #0b3954;
  --navy-dark: #062b40;

  --blue: #087e8b;
  --cyan: #42b7c5;

  --sand: #f8f4ec;
  --cream: #fffdf8;
  --white: #ffffff;

  --text: #23313b;
  --muted: #71808a;

  --line: #e7e2d9;

  --green: #24966b;
  --green-light: #e8f7ef;

  --orange: #e89a3d;
  --red: #d95c5c;

  --shadow:
    0 10px 30px rgba(11,57,84,.09);

  --radius: 20px;
}


* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}


html {
  scroll-behavior: smooth;
}


body {

  margin: 0;

  background:
    linear-gradient(
      180deg,
      #eaf7f8 0,
      #f8f4ec 260px,
      #f8f4ec 100%
    );

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  font-size: 16px;

  line-height: 1.7;

}


button,
input {
  font: inherit;
}


button {
  cursor: pointer;
}


/* =========================================================
   App
========================================================= */

.app {

  max-width: 680px;

  margin: 0 auto;

  min-height: 100vh;

  padding-bottom: 110px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

  padding:
    30px
    20px
    22px;

  color: white;

  background:
    linear-gradient(
      135deg,
      rgba(7,43,64,.98),
      rgba(11,57,84,.94)
    );

  border-radius:
    0 0 32px 32px;

  box-shadow:
    0 12px 30px
    rgba(7,43,64,.18);

}


.hero-top {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 15px;

}


.eyebrow {

  font-size: 12px;

  letter-spacing: 2px;

  opacity: .72;

}


.hero h1 {

  margin: 2px 0 0;

  font-size: 28px;

  line-height: 1.3;

}


.hero p {

  margin: 8px 0 0;

  color:
    rgba(255,255,255,.78);

  font-size: 15px;

}


.hero-icon {

  width: 52px;

  height: 52px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.12);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;

}


/* =========================================================
   DAY TAB
========================================================= */

.tabs-wrap {

  position: sticky;

  top: 0;

  z-index: 20;

  padding: 12px 15px;

  background:
    rgba(248,244,236,.94);

  backdrop-filter:
    blur(14px);

  border-bottom:
    1px solid
    rgba(232,227,217,.7);

}


.tabs {

  display: flex;

  gap: 9px;

  overflow-x: auto;

  scrollbar-width: none;

}


.tabs::-webkit-scrollbar {
  display: none;
}


.day-btn {

  flex: 0 0 auto;

  border: 0;

  background: white;

  color: var(--muted);

  min-width: 82px;

  padding: 10px 14px;

  border-radius: 15px;

  box-shadow:
    0 3px 12px
    rgba(11,57,84,.05);

  font-weight: 700;

}


.day-btn small {

  display: block;

  font-size: 11px;

  font-weight: 500;

}


.day-btn.active {

  color: white;

  background: var(--navy);

}


/* =========================================================
   MAIN
========================================================= */

main {

  padding:
    18px 16px 0;

}


.day-header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-end;

  gap: 15px;

  margin:
    5px 4px 16px;

}


.day-title {

  margin: 0;

  color: var(--navy);

  font-size: 25px;

  line-height: 1.3;

}


.day-subtitle {

  color: var(--muted);

  font-size: 14px;

  margin-top: 4px;

}


.route-pill {

  white-space: nowrap;

  background: #e8f5f6;

  color: var(--blue);

  padding: 7px 11px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: 700;

}


/* =========================================================
   TIMELINE
========================================================= */

.timeline {

  position: relative;

}


.timeline::before {

  content: "";

  position: absolute;

  left: 26px;

  top: 20px;

  bottom: 25px;

  width: 2px;

  background:
    linear-gradient(
      to bottom,
      #9edce2,
      #dcebe9
    );

}


.stop {

  position: relative;

  padding-left: 58px;

  margin-bottom: 18px;

}


.stop-dot {

  position: absolute;

  left: 15px;

  top: 15px;

  width: 24px;

  height: 24px;

  border-radius: 50%;

  background: white;

  border: 6px solid var(--cyan);

  box-shadow:
    0 0 0 4px
    rgba(66,183,197,.12);

  z-index: 2;

}


.card {

  background:
    rgba(255,255,255,.96);

  border:
    1px solid
    rgba(232,227,217,.8);

  border-radius: var(--radius);

  padding: 17px;

  box-shadow: var(--shadow);

}


.time {

  color: var(--blue);

  font-size: 14px;

  font-weight: 800;

}


.place {

  margin: 4px 0 0;

  color: var(--navy);

  font-size: 20px;

  line-height: 1.35;

}


.description {

  margin:
    7px 0 13px;

  color: #5e6c74;

  font-size: 15px;

}


.route-line {

  color: #77848a;

  font-size: 13px;

  margin-bottom: 10px;

}


.map-btn {

  width: 100%;

  border: 0;

  border-radius: 14px;

  padding: 12px;

  background: var(--navy);

  color: white;

  font-weight: 800;

  font-size: 16px;

}


/* =========================================================
   VILLA
========================================================= */

.villa {

  background:
    linear-gradient(
      135deg,
      #e9f8ef,
      #f6fff9
    );

  border:
    2px solid #9bd6b8;

}


.villa-badge {

  display: inline-block;

  background:
    var(--green);

  color: white;

  border-radius: 999px;

  padding: 5px 10px;

  font-size: 12px;

  font-weight: 800;

}


/* =========================================================
   SECTION
========================================================= */

.section {

  margin-top: 30px;

}


.section-title {

  color: var(--navy);

  font-size: 21px;

  margin:
    0 0 12px;

}


/* =========================================================
   TRANSLATOR
========================================================= */

.translator {

  background: white;

  border-radius: 24px;

  padding: 16px;

  box-shadow: var(--shadow);

}


/* category */

.translate-categories {

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 8px;

  scrollbar-width: none;

}


.translate-categories::-webkit-scrollbar {
  display: none;
}


.category-btn {

  flex: 0 0 auto;

  border: 0;

  background: #f1f5f5;

  color: #627078;

  padding:
    9px 13px;

  border-radius: 999px;

  font-size: 14px;

  font-weight: 700;

}


.category-btn.active {

  background: var(--navy);

  color: white;

}


/* phrase list */

.phrase-list {

  display: grid;

  gap: 10px;

  margin-top: 8px;

}


.phrase {

  border:
    1px solid
    var(--line);

  border-radius: 17px;

  padding: 14px;

  background:
    #fffefa;

}


.phrase-chinese {

  font-size: 15px;

  font-weight: 800;

  color: #53636b;

}


.phrase-japanese {

  margin-top: 5px;

  color: var(--navy);

  font-size: 22px;

  font-weight: 900;

  line-height: 1.45;

}


.phrase-romaji {

  color: #89959a;

  font-size: 13px;

  margin-top: 2px;

}


.phrase-actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 10px;

}


.phrase-btn {

  border: 0;

  border-radius: 12px;

  padding: 10px 8px;

  font-weight: 800;

  font-size: 14px;

}


.speak-btn {

  background:
    #e8f5f6;

  color: var(--blue);

}


.copy-btn {

  background:
    #f2f2f2;

  color: #5f6c72;

}


/* =========================================================
   CONVERSATION MODE
========================================================= */

.conversation {

  margin-top: 14px;

  background:
    linear-gradient(
      135deg,
      #0b3954,
      #087e8b
    );

  color: white;

  border-radius: 22px;

  padding: 18px;

}


.conversation-title {

  font-size: 18px;

  font-weight: 900;

}


.conversation-help {

  color:
    rgba(255,255,255,.75);

  font-size: 13px;

  margin-top: 2px;

}


.conversation-screen {

  margin-top: 14px;

  background:
    rgba(255,255,255,.1);

  border-radius: 17px;

  padding: 15px;

  text-align: center;

}


.conversation-cn {

  font-size: 15px;

  opacity: .8;

}


.conversation-jp {

  margin-top: 5px;

  font-size: 29px;

  font-weight: 900;

  line-height: 1.4;

}


.conversation-romaji {

  opacity: .65;

  font-size: 13px;

}


.conversation-buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 12px;

}


.conversation-buttons button {

  border: 0;

  border-radius: 13px;

  padding: 12px;

  font-weight: 900;

}


.next-btn {

  background: white;

  color: var(--navy);

}


.repeat-btn {

  background:
    rgba(255,255,255,.13);

  color: white;

}


/* =========================================================
   EXPENSE
========================================================= */

.expense-summary {

  background:
    linear-gradient(
      135deg,
      #0b3954,
      #087e8b
    );

  color: white;

  border-radius: 24px;

  padding: 20px;

}


.expense-label {

  opacity: .76;

  font-size: 13px;

}


.expense-total {

  font-size: 32px;

  font-weight: 900;

}


.expense-jpy {

  font-size: 14px;

  opacity: .8;

}


.rate-row {

  margin-top: 14px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  background:
    rgba(255,255,255,.1);

  border-radius: 13px;

  padding: 10px;

  font-size: 13px;

}


.rate-row input {

  width: 80px;

  border: 0;

  border-radius: 9px;

  padding: 5px;

  text-align: right;

}


.expense-form {

  margin-top: 12px;

  background: white;

  border-radius: 20px;

  padding: 16px;

  box-shadow: var(--shadow);

}


.input-group {

  display: grid;

  grid-template-columns:
    1fr 110px;

  gap: 10px;

}


.field {

  width: 100%;

  border:
    1px solid var(--line);

  background: #fffdf9;

  border-radius: 13px;

  padding: 12px;

  outline: none;

}


.add-btn {

  width: 100%;

  margin-top: 10px;

  border: 0;

  background: var(--blue);

  color: white;

  padding: 12px;

  border-radius: 13px;

  font-weight: 800;

}


.expense-list {

  margin-top: 12px;

  display: grid;

  gap: 9px;

}


.expense-item {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  background: white;

  border:
    1px solid var(--line);

  border-radius: 15px;

  padding: 12px 14px;

}


.expense-name {
  font-weight: 700;
}


.expense-date {

  color: var(--muted);

  font-size: 12px;

}


.expense-money {

  text-align: right;

}


.delete-btn {

  margin-left: 6px;

  border: 0;

  background: #fff0f0;

  color: var(--red);

  border-radius: 9px;

  padding: 5px 7px;

}


.clear-btn {

  margin-top: 10px;

  border:
    1px solid #efcccc;

  background: white;

  color: var(--red);

  border-radius: 11px;

  padding: 8px 11px;

}


/* =========================================================
   PACKING
========================================================= */

.packing {

  background: white;

  border-radius: 22px;

  padding: 17px;

  box-shadow: var(--shadow);

}


.check-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px 2px;

  border-bottom:
    1px solid var(--line);

}


.check-item input {

  width: 22px;

  height: 22px;

  accent-color: var(--green);

}


.check-item.done span {

  text-decoration: line-through;

  color: #9aa3a7;

}


.packing-progress {

  margin-top: 12px;

  height: 8px;

  background: #edf1ef;

  border-radius: 999px;

  overflow: hidden;

}


.packing-progress-bar {

  height: 100%;

  background:
    linear-gradient(
      90deg,
      var(--green),
      #67c89a
    );

  width: 0%;

}


/* =========================================================
   SAFETY
========================================================= */

.safety {

  background: white;

  border-radius: 22px;

  padding: 17px;

  box-shadow: var(--shadow);

}


.emergency-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

}


.emergency-btn {

  border: 0;

  border-radius: 16px;

  padding: 15px;

  color: white;

  font-weight: 900;

  font-size: 16px;

}


.police {

  background: #2356a4;

}


.ambulance {

  background: #d74d4d;

}


.jnto {

  grid-column: 1 / -1;

  background: var(--navy);

}


.mcc {

  grid-column: 1 / -1;

  background: var(--green);

}


/* =========================================================
   NOTICE
========================================================= */

.notice {

  margin-top: 18px;

  background: #fff8e9;

  border:
    1px solid #f0d59d;

  border-radius: 18px;

  padding: 15px;

}


.notice-title {

  color: #a46a13;

  font-weight: 900;

}


.notice p {

  margin: 0;

  font-size: 14px;

  color: #735b35;

}


/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar {

  position: fixed;

  left: 50%;

  bottom: 12px;

  transform:
    translateX(-50%);

  width:
    min(
      650px,
      calc(100% - 24px)
    );

  background:
    rgba(7,43,64,.94);

  backdrop-filter:
    blur(14px);

  border-radius: 20px;

  padding: 8px;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 5px;

  box-shadow:
    0 15px 35px
    rgba(7,43,64,.28);

  z-index: 50;

}


.bottom-btn {

  border: 0;

  background: transparent;

  color:
    rgba(255,255,255,.65);

  padding: 9px 4px;

  border-radius: 13px;

  font-size: 11px;

  font-weight: 700;

}


.bottom-btn span {

  display: block;

  font-size: 20px;

  line-height: 1;

  margin-bottom: 3px;

}


.bottom-btn.active {

  color: white;

  background:
    rgba(255,255,255,.12);

}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:700px) {

  body {
    padding: 20px 0;
  }

  .app {

    background: #f8f4ec;

    border-radius: 30px;

    overflow: hidden;

    box-shadow:
      0 20px 70px
      rgba(11,57,84,.13);

  }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================================
     HERO
====================================================== -->

<header class="hero">

  <div class="hero-top">

    <div>

      <div class="eyebrow">
        FAMILY ROAD TRIP · OKINAWA 2026
      </div>

      <h1>
        沖繩 5 天 4 夜
      </h1>

      <p>
        長輩友善・慢遊自駕・翻譯助手
      </p>

    </div>

    <div class="hero-icon">
      🌺
    </div>

  </div>

</header>



<!-- ======================================================
     DAY TABS
======================================================= -->

<div class="tabs-wrap">

  <div
    class="tabs"
    id="dayTabs"
  ></div>

</div>



<main>


<!-- ======================================================
     行程
======================================================= -->

<section id="scheduleSection">

  <div class="day-header">

    <div>

      <h2
        class="day-title"
        id="dayTitle"
      ></h2>

      <div
        class="day-subtitle"
        id="daySubtitle"
      ></div>

    </div>

    <div
      class="route-pill"
      id="routePill"
    ></div>

  </div>


  <div
    class="timeline"
    id="timeline"
  ></div>


  <div
    class="notice"
    id="flightNotice"
    style="display:none;"
  >

    <div class="notice-title">
      ✈️ 回程提醒
    </div>

    <p>
      建議最晚
      <strong>11:15 前抵達租車公司</strong>
      完成還車，再前往那霸機場。
    </p>

  </div>

</section>



<!-- ======================================================
     翻譯助手
======================================================= -->

<section
  class="section"
  id="translateSection"
>

  <h2 class="section-title">
    🗣️ 長輩翻譯助手
  </h2>


  <div class="translator">


    <!-- 分類 -->

    <div
      class="translate-categories"
      id="translateCategories"
    ></div>


    <!-- 句子 -->

    <div
      class="phrase-list"
      id="phraseList"
    ></div>


    <!-- 對話模式 -->

    <div class="conversation">

      <div class="conversation-title">
        💬 一鍵對話模式
      </div>

      <div class="conversation-help">
        不用打字，直接選一句給對方看或播放。
      </div>


      <div class="conversation-screen">

        <div
          class="conversation-cn"
          id="conversationCn"
        ></div>

        <div
          class="conversation-jp"
          id="conversationJp"
        ></div>

        <div
          class="conversation-romaji"
          id="conversationRomaji"
        ></div>

      </div>


      <div class="conversation-buttons">

        <button
          class="repeat-btn"
          onclick="speakCurrent()"
        >
          🔊 再念一次
        </button>

        <button
          class="next-btn"
          onclick="nextConversation()"
        >
          ➜ 下一句
        </button>

      </div>

    </div>


  </div>

</section>



<!-- ======================================================
     記帳
======================================================= -->

<section
  class="section"
  id="expenseSection"
>

  <h2 class="section-title">
    💴 記帳小助手
  </h2>


  <div class="expense-summary">

    <div class="expense-label">
      目前總花費
    </div>

    <div
      class="expense-total"
      id="totalTwd"
    >
      NT$ 0
    </div>

    <div
      class="expense-jpy"
      id="totalJpy"
    >
      ¥ 0
    </div>


    <div class="rate-row">

      <span>
        💱 JPY → TWD
      </span>

      <input
        id="rateInput"
        type="number"
        step="0.001"
        value="0.220"
      >

    </div>

  </div>


  <div class="expense-form">

    <div class="input-group">

      <input
        class="field"
        id="expenseName"
        placeholder="例如：晚餐"
      >

      <input
        class="field"
        id="expenseAmount"
        type="number"
        inputmode="decimal"
        placeholder="日幣 ¥"
      >

    </div>


    <button
      class="add-btn"
      onclick="addExpense()"
    >
      ＋ 加入一筆支出
    </button>

  </div>


  <div
    class="expense-list"
    id="expenseList"
  ></div>


  <button
    class="clear-btn"
    onclick="clearExpenses()"
  >
    清除全部記帳
  </button>

</section>



<!-- ======================================================
     行李
======================================================= -->

<section
  class="section"
  id="packingSection"
>

  <h2 class="section-title">
    🧳 出發前行李清單
  </h2>


  <div class="packing">

    <div id="packingList"></div>

    <div class="packing-progress">

      <div
        class="packing-progress-bar"
        id="packingProgress"
      ></div>

    </div>


    <div
      id="packingStatus"
      style="
        margin-top:8px;
        color:#71808a;
        font-size:13px;
      "
    ></div>

  </div>

</section>



<!-- ======================================================
     緊急資訊
======================================================= -->

<section
  class="section"
  id="safetySection"
>

  <h2 class="section-title">
    🆘 旅行安全
  </h2>


  <div class="safety">

    <div class="emergency-grid">

      <button
        class="emergency-btn police"
        onclick="callNumber('110')"
      >
        🚓<br>
        警察 110
      </button>


      <button
        class="emergency-btn ambulance"
        onclick="callNumber('119')"

/* =========================================================

function renderDayTabs() {

  const container =
    document.getElementById(
      "dayTabs"
    );

  container.innerHTML = "";


  Object.keys(itinerary)
    .forEach(day => {

      const data =
        itinerary[day];

      const button =
        document.createElement(
          "button"
        );

      button.className =
        `day-btn ${
          Number(day) === currentDay
          ? "active"
          : ""
        }`;

      button.innerHTML =
        `DAY ${day}
         <small>
           ${data.date}
         </small>`;


      button.onclick = () => {

        currentDay =
          Number(day);

        renderDayTabs();

        renderDay();

      };


      container
        .appendChild(button);

    });

}

/* =========================================================
   Google Maps
========================================================= */

function openMap(destination) {

  const encoded =
    encodeURIComponent(
      destination
    );


  const url =
    `https://www.google.com/maps/dir/?api=1&destination=${encoded}`;


  window.open(
    url,
    "_blank"
  );

}


function escapeQuotes(text) {

  return text
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}

  Object.keys(
    translationData

        : ""

      currentCategory =

      conversationIndex = 0;

      renderTranslator();

      updateConversation();

    };


    categories

  renderPhrases();

}

/* =========================================================
   語音朗讀
========================================================= */

function speakJapanese(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "此 iPhone 瀏覽器不支援語音朗讀。"
    );

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ja-JP";


  utterance.rate =
    0.78;


  utterance.pitch =
    1;


  window.speechSynthesis
    .speak(utterance);

}



/* =========================================================
   對話模式
========================================================= */

function updateConversation() {

  const list =
    translationData[
      currentCategory
    ];


  const phrase =
    list[
      conversationIndex %
      list.length
    ];


  document
    .getElementById(
      "conversationCn"
    )
    .textContent =
    phrase.cn;


  document
    .getElementById(
      "conversationJp"
    )
    .textContent =
    phrase.jp;


  document
    .getElementById(
      "conversationRomaji"
    )
    .textContent =
    phrase.romaji;

}



function nextConversation() {

  const list =
    translationData[
      currentCategory
    ];


  conversationIndex =
    (
      conversationIndex + 1
    ) % list.length;


  updateConversation();


  speakCurrent();

}



function speakCurrent() {

  const list =
    translationData[
      currentCategory
    ];


  const phrase =
    list[
      conversationIndex %
      list.length
    ];


  speakJapanese(
    phrase.jp
  );

}

async function copyText(text) {

  try {

    await navigator
      .clipboard
      .writeText(text);


    alert(
      "已複製日文，可以貼給對方看。"
    );

  } catch {

    alert(
      "請長按日文文字進行複製。"
    );

  }

}

   記帳
========================================================= */

function updateRate(event) {

  const value =
    Number(
      event.target.value
    );


  if (
    !value ||
    value <= 0
  ) {

    return;

  }


  exchangeRate =
    value;


  localStorage.setItem(
    "okinawaRate",
    exchangeRate
  );


  renderExpenses();

}



function addExpense() {

  const name =
    document
      .getElementById(
        "expenseName"
      )
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById(
          "expenseAmount"
        )
        .value
    );


  if (!name) {

    alert(
      "請輸入支出項目"
    );

    return;

  }


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "請輸入正確的日幣金額"
    );

    return;

  }


  expenses.unshift({

    id: Date.now(),

    name,

    amount,

    day: currentDay,

    date:
      new Date()
      .toLocaleDateString(
        "zh-TW",
        {
          month:"numeric",
          day:"numeric"
        }
      )

  });


  localStorage.setItem(
    "okinawaExpenses",
    JSON.stringify(
      expenses
    )
  );


  document
    .getElementById(
      "expenseName"
    )
    .value = "";


  document
    .getElementById(
      "expenseAmount"
    )
    .value = "";


  renderExpenses();

}



function deleteExpense(id) {

  expenses =
    expenses.filter(
      item =>
        item.id !== id
    );


  localStorage.setItem(
    "okinawaExpenses",
    JSON.stringify(
      expenses
    )
  );


  renderExpenses();

}



function clearExpenses() {

  if (
    !expenses.length
  ) return;


  if (
    !confirm(
      "確定清除全部記帳？"
    )
  ) return;


  expenses = [];


  localStorage.removeItem(
    "okinawaExpenses"
  );


  renderExpenses();

}



function renderExpenses() {

  const totalJpy =
    expenses.reduce(
      (sum,item) =>
        sum +
        Number(item.amount),
      0
    );


  const totalTwd =
    totalJpy *
    exchangeRate;


  document
    .getElementById(
      "totalJpy"
    )
    .textContent =
    `¥ ${totalJpy.toLocaleString()}`;


  document
    .getElementById(
      "totalTwd"
    )
    .textContent =
    `NT$ ${Math.round(
      totalTwd
    ).toLocaleString()}`;


  const list =
    document.getElementById(
      "expenseList"
    );


  list.innerHTML = "";


  if (
    !expenses.length
  ) {

    list.innerHTML = `

      <div
        style="
          text-align:center;
          color:#8b979c;
          background:white;
          border-radius:15px;
          padding:18px;
        "
      >
        目前還沒有記帳資料
      </div>

    `;

    return;

  }


  expenses.forEach(
    item => {

      const twd =
        item.amount *
        exchangeRate;


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "expense-item";


      element.innerHTML = `

        <div>

          <div class="expense-name">
            ${item.name}
          </div>

          <div class="expense-date">
            DAY ${item.day}
            · ${item.date}
          </div>

        </div>


        <div class="expense-money">

          <strong>
            ¥ ${Number(
              item.amount
            ).toLocaleString()}
          </strong>

          <span
            style="
              color:#71808a;
              font-size:12px;
            "
          >
            ≈ NT$
            ${Math.round(
              twd
            ).toLocaleString()}
          </span>


          <button
            class="delete-btn"
            onclick="
              deleteExpense(
                ${item.id}
              )
            "
          >
            ×
          </button>

        </div>

      `;


      list.appendChild(
        element
      );

    });

}



/* =========================================================
   行李
========================================================= */

function renderPacking() {

  const container =
    document.getElementById(
      "packingList"
    );


  container.innerHTML = "";


  packingItems.forEach(
    (item,index) => {

      const checked =
        Boolean(
          packingState[index]
        );


      const element =
        document.createElement(
          "label"
        );


      element.className =
        `check-item ${
          checked ? "done" : ""
        }`;


      element.innerHTML = `

        <input
          type="checkbox"
          ${checked ? "checked" : ""}
          onchange="
            togglePacking(
              ${index},
              this.checked
            )
          "
        >

        <span>
          ${item}
        </span>

      `;


      container.appendChild(
        element
      );

    });


  updatePackingProgress();

}



function togglePacking(
  index,
  checked
) {

  packingState[index] =
    checked;


  localStorage.setItem(
    "okinawaPacking",
    JSON.stringify(
      packingState
    )
  );


  renderPacking();

}



function updatePackingProgress() {

  const completed =
    packingItems.filter(
      (_,index) =>
        Boolean(
          packingState[index]
        )
    ).length;


  const percentage =
    Math.round(
      completed /
      packingItems.length *
      100
    );


  document
    .getElementById(
      "packingProgress"
    )
    .style.width =
    `${percentage}%`;


  document
    .getElementById(
      "packingStatus"
    )
    .textContent =
    `已完成 ${completed} / ${
      packingItems.length
    } 項（${percentage}%）`;

}



/* =========================================================
   緊急電話
========================================================= */

function callNumber(number) {

  window.location.href =
    `tel:${number}`;

}



/* =========================================================
   底部選單
========================================================= */

function scrollToSection(
  id,
  button
) {

  document
    .getElementById(id)
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  document
    .querySelectorAll(
      ".bottom-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );

}

</script>

</html>
